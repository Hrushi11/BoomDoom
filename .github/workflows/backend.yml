name: backend
on:
  pull_request: { paths: ["backend/**"] }
  push: { branches: [main], paths: ["backend/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: boomdoom, POSTGRES_PASSWORD: boomdoom, POSTGRES_DB: boomdoom_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s
    env:
      TEST_DATABASE_URL: postgresql+psycopg://boomdoom:boomdoom@localhost:5432/boomdoom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: docker build -t boomdoom-backend .
