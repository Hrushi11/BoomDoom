name: infra
on:
  pull_request: { paths: ["infra/**"] }
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: for e in demo dev prod; do terraform -chdir=infra/envs/$e init -backend=false && terraform -chdir=infra/envs/$e validate; done
