# BoomDoom POC: everything on one EC2 host (Product Spec §7.2 "hackathon version").
# Image: ghcr.io/<owner>/boomdoom-backend:latest (built by GitHub Actions). Secrets: /opt/boomdoom/.env from SSM.
x-app: &app
  image: ${BOOMDOOM_IMAGE}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://boomdoom:${POSTGRES_PASSWORD}@db:5432/boomdoom
    QUEUE_BACKEND: db
    STORAGE_BACKEND: s3
  restart: unless-stopped
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION}
      awslogs-group: /boomdoom/poc
      awslogs-create-group: "true"
      tag: "{{.Name}}"
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boomdoom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: boomdoom
    volumes: [/opt/boomdoom/pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boomdoom"]
      interval: 5s
      retries: 20

  migrate:
    image: ${BOOMDOOM_IMAGE}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://boomdoom:${POSTGRES_PASSWORD}@db:5432/boomdoom
    command: alembic upgrade head
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://boomdoom:${POSTGRES_PASSWORD}@db:5432/boomdoom
      QUEUE_BACKEND: db
      STORAGE_BACKEND: s3
      SERVICE_NAME: api

  script-worker:
    <<: *app
    command: python -m workers script
    stop_grace_period: 60s

  render-worker:
    <<: *app
    command: python -m workers render
    stop_grace_period: 120s
    # Films spend most of their ~9 min waiting on OpenAI (plan, code, two vision reviews), so three run side by side
    # on the 4-vCPU host; each renders with 2 Chromium processes instead of 4. Jobs are claimed atomically.
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgresql+psycopg://boomdoom:${POSTGRES_PASSWORD}@db:5432/boomdoom
      QUEUE_BACKEND: db
      STORAGE_BACKEND: s3
      FILM_RENDER_JOBS: "2"

  scheduler:
    <<: *app
    command: python -m app.cron loop

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${API_HOST} --to api:8000
    volumes: [/opt/boomdoom/caddy:/data]
    restart: unless-stopped
    depends_on: [api]
